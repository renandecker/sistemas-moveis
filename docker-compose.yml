services:
  postgres:
    image: postgres:16-alpine
    # Sem "container_name" fixo de propósito: se você tiver mais de uma cópia
    # desta pasta (ex.: em Downloads e no OneDrive), cada uma cria seu próprio
    # container com nome baseado na pasta, sem conflitar uma com a outra.
    # Os scripts usam "docker compose exec postgres" (nome do serviço, não do
    # container) para funcionar independente do nome real gerado.
    restart: unless-stopped
    environment:
      POSTGRES_DB: moveis_db
      POSTGRES_USER: moveis
      POSTGRES_PASSWORD: moveis123
    ports:
      - "5452:5432"
    volumes:
      - moveis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveis -d moveis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend (Quarkus). Opcional: para desenvolvimento do dia a dia com
  # live-reload, prefira rodar "mvn quarkus:dev" direto na máquina (veja o
  # README) — esse serviço aqui é útil pra testar a imagem de produção
  # (Dockerfile) de ponta a ponta, ou pra rodar tudo com um único comando.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "postgres" aqui é o nome do serviço acima, resolvido pela rede interna
      # do compose — não é o mesmo endereço que localhost:5452 usado de fora.
      DB_URL: jdbc:postgresql://postgres:5432/moveis_db
      DB_USER: moveis
      DB_PASSWORD: moveis123
    ports:
      - "9190:9190"

volumes:
  moveis_pgdata:
