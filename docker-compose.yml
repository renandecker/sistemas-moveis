services:
  postgres:
    image: postgres:16-alpine
    # Sem "container_name" fixo de propósito: se você tiver mais de uma cópia
    # desta pasta (ex.: em Downloads e no OneDrive), cada uma cria seu próprio
    # container com nome baseado na pasta, sem conflitar uma com a outra.
    # Os scripts usam "docker compose exec postgres" (nome do serviço, não do
    # container) para funcionar independente do nome real gerado.
    restart: unless-stopped
    environment:
      POSTGRES_DB: moveis_db
      POSTGRES_USER: moveis
      POSTGRES_PASSWORD: moveis123
    ports:
      - "5452:5432"
    volumes:
      - moveis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveis -d moveis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moveis_pgdata:
