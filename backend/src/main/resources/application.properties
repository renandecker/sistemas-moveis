# ===================== Datasource / PostgreSQL =====================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:moveis}
quarkus.datasource.password=${DB_PASSWORD:moveis123}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5452/moveis_db}

# ===================== Datasource — perfil "neon" (banco na nuvem) =====================
# Ativado com -Dquarkus.profile=neon (ou QUARKUS_PROFILE=neon). O host e o
# nome do banco não são segredo, então ficam fixos aqui; usuário e senha
# SEMPRE vêm de variável de ambiente (DB_USER / DB_PASSWORD), nunca gravados
# neste arquivo — veja windows/start-backend-neon.ps1 e a seção "Neon" do
# README para como rodar.
%neon.quarkus.datasource.username=${DB_USER}
%neon.quarkus.datasource.password=${DB_PASSWORD}
%neon.quarkus.datasource.jdbc.url=jdbc:postgresql://ep-young-water-acjoayuy-pooler.sa-east-1.aws.neon.tech/paje?sslmode=require
# Pool pequeno: bancos serverless (Neon) cobram/limitam por conexão simultânea
%neon.quarkus.datasource.jdbc.max-size=5
# Nunca deixe o Hibernate alterar o schema de um banco de produção/nuvem por engano
%neon.quarkus.hibernate-orm.database.generation=validate
%neon.quarkus.hibernate-orm.sql-load-script=no-file

# ===================== Hibernate ORM =====================
# 'update' em dev facilita; troque para 'validate' em produção e use migrations (Flyway/Liquibase) reais
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.sql-load-script=import.sql

# ===================== HTTP / CORS (necessário p/ o front React em outra porta) =====================
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:9190}
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# ===================== OpenAPI / Swagger UI =====================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true

# ===================== Regras de negócio (Fatores de Perda padrão) =====================
# Faixas definidas na especificação técnica (Seção 1 - Fator de Perda/Avaria)
app.fator-perda.ferragem.min=0.05
app.fator-perda.ferragem.max=0.10
app.fator-perda.chapa.min=0.15
app.fator-perda.chapa.max=0.25
app.tolerancia-dimensional-mm=1
app.fita-borda.fator-seguranca=1.10
